name: Refresh dependency lockfile

on:
  push:
    branches:
      - audit/dependencies

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Next.js security patch"
          git push origin HEAD:audit/dependencies
